let step=0,scores={nada:0,fushimi:0,hiroshima:0},selectedAnswers=[];
const q=document.getElementById('question'),choices=document.getElementById('choices'),bars=[...document.querySelectorAll('.progress span')];
function render(){q.textContent=questions[step].q;document.getElementById('quizStep').textContent=`3問で選ぶ · ${step+1} / 3`;bars.forEach((b,i)=>b.classList.toggle('on',i<=step));choices.replaceChildren(...questions[step].a.map(([label,key])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>answer(key);return b}))}
function showCandidates(region){
 const root=document.getElementById('candidates');root.replaceChildren();
 const answers=selectedAnswers.slice(),ranked=rankDiagnosisCatalog(diagnosisProducts,answers);
 const title=document.createElement('h3');title.textContent='全酒の'+ranked.length+'候補から、見比べたい3本';root.append(title);
 ranked.slice(0,3).forEach(item=>{
  const card=document.createElement('article');card.className='sake-card';card.dataset.code=item.product_code;
  const image=document.createElement('img');image.src=item.image_url;image.alt=item.name;image.loading='lazy';image.style.cssText='width:100%;height:180px;object-fit:contain';
  const name=document.createElement('h4');name.textContent=item.name;
  const taste=document.createElement('p');taste.textContent=(item.taste_keywords||[]).join('・')||'味わいの詳しい説明は商品情報でご覧ください。';
  const evidence=diagnosisEvidence(item,answers),reason=document.createElement('p');reason.className='selection-reason';reason.textContent=evidence.taste.length?'お好みに近い言葉：'+evidence.taste.join('・'):'公開商品情報から、飲み比べの候補としてご紹介します。';
  const meta=document.createElement('p');meta.className='meta';meta.textContent=[item.capacity_ml?item.capacity_ml+'ml':'',item.product_facts?.origin||'',item.subcategories.join(' / ')].filter(Boolean).join(' · ');
  const detail=document.createElement('a');detail.className='secondary';const params=new URLSearchParams({diagnosis:answers.join(','),product:item.product_code});detail.href='./zenshu/index.html?'+params;detail.textContent='この一本を見る →';
  card.append(image,name,taste,meta,detail);root.append(card);
 });
 const next=document.createElement('a');next.className='secondary';next.href='./zenshu/index.html?'+new URLSearchParams({diagnosis:answers.join(',')})+'#explore';next.textContent='診断に近い順で、全'+ranked.length+'候補を見比べる';root.append(next);
}
function showSaveStatus(saved,status){
 const el=document.getElementById('saveStatus');el.classList.remove('hidden');el.dataset.syncStatus=status;
 if(!saved){el.textContent='この端末に保存できませんでした。結果は表示できますが、再読み込み後には残りません。';return}
 const labels={sent:'LINEアカウントに診断結果を保存しました。',checking:'このブラウザに保存しました。LINEへの保存状況を確認しています。',login_required:'このブラウザに保存しました。LINEには保存していません。LINE内でログインして診断すると、アカウントに保存できます。',pending:'このブラウザに保存しました。LINEへの保存は未完了です。通信状況を確認してから再度開いてください。',unknown:'このブラウザに保存しました。LINEへの保存結果を確認できませんでした。',saved_local:'このブラウザに診断結果を保存しました。'};
 el.textContent=labels[status]||'このブラウザに保存しました。LINEへの保存は確認できていません。';
}
function saveDiagnosis(best){
 const record={version:2,answers:selectedAnswers.slice(),scores:{...scores},result:best,savedAt:new Date().toISOString()};
 try{
  localStorage.setItem(DIAGNOSIS_STORAGE_KEY,JSON.stringify(record));
  // Local receipt and identity-bound LINE receipt are separate states.
  if(window.CaratRewards){
   if(window.CaratLiffSync){const update=status=>{if(localStorage.getItem(DIAGNOSIS_STORAGE_KEY)===JSON.stringify(record))showSaveStatus(true,status)};const timer=setTimeout(()=>update('unknown'),15000);window.CaratLiffSync.recordCurrent(record,window.CARAT_INTEGRATION_CONFIG,window.CaratRewards,localStorage).then(result=>{clearTimeout(timer);update(result.status)}).catch(()=>{clearTimeout(timer);update('unknown')});}
   else window.CaratRewards.recordDiagnosis(record,window.CARAT_INTEGRATION_CONFIG,localStorage);
  }
  return true;
 }catch(error){return false}
}
function answer(key){selectedAnswers.push(key);scores[key]++;step++;if(step<questions.length)return render();const leaders=Object.keys(scores).filter(k=>scores[k]===Math.max(...Object.values(scores)));const best=leaders.includes(selectedAnswers[1])?selectedAnswers[1]:leaders[0];const saved=saveDiagnosis(best);showSaveStatus(saved,window.CARAT_INTEGRATION_CONFIG?.bridge?.enabled&&window.CaratLiffSync&&window.CaratRewards?'checking':'saved_local');document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('place').textContent=diagnosisStyleLabels[selectedAnswers[1]];document.getElementById('description').textContent='気になる一本の、味と料理を見てみましょう。';showCandidates(best)}
render();
// 前回の同期が未完了なら、次回表示時にも安全に再試行する。sent済みは再送しない。
if(window.CaratLiffSync&&window.CaratRewards)window.CaratLiffSync.syncLatest(window.CARAT_INTEGRATION_CONFIG,window.CaratRewards,localStorage);
document.getElementById('restartDiagnosis').addEventListener('click',()=>{step=0;scores={nada:0,fushimi:0,hiroshima:0};selectedAnswers=[];document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
