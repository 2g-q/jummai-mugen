<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>じゅんまいムゲン｜KOMOJU接続試作</title>
  <style>:root{--navy:#10233f;--gold:#b48a3c;--paper:#f8f5ef;--ink:#17202b}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{width:min(680px,calc(100% - 32px));margin:32px auto}.notice{padding:12px 16px;border:1px solid #c79532;background:#fff4d8;font-weight:700;border-radius:10px}.card{margin-top:16px;padding:24px;overflow:hidden;background:#fff;border:1px solid #ded7c9;border-radius:18px;box-shadow:0 10px 30px rgba(16,35,63,.08)}h1{margin:0 0 8px;color:var(--navy);font-size:clamp(24px,6vw,34px)}.lead{margin:0 0 24px;color:#53606d}dl{display:grid;grid-template-columns:9em 1fr;gap:12px 8px;margin:0}dt{font-weight:700}dd{min-width:0;margin:0;overflow-wrap:anywhere}.price{margin:24px 0 6px;font-size:18px}.price strong{color:var(--navy);font-size:36px}button{width:100%;margin-top:20px;padding:17px 20px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:18px;font-weight:700;cursor:pointer}button[disabled]{background:#8993a0;cursor:not-allowed}#status{min-height:1.5em;margin:12px 0 0;color:#6b4f12;font-weight:700}.small{margin-top:22px;font-size:13px;color:#68727d;line-height:1.7}@media(max-width:480px){main{margin:16px auto}.card{padding:20px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:8px}}</style>
</head>
<body><main><div class="notice">審査・接続確認用の試作です。現在は決済を停止しています。</div><section class="card" aria-labelledby="title"><h1 id="title">ロブ6 飲み比べ4本セット</h1><p class="lead">LINEの購入ボタンからKOMOJUへ渡す直前の確認画面</p><dl><dt>セット内容</dt><dd>ロブ6 × 2本、ロブ6+1 × 2本</dd><dt>数量</dt><dd>先着10名様</dd><dt>送料</dt><dd>無料</dd><dt>予約開始</dt><dd>2026年11月15日ごろ予定</dd><dt>お届け</dt><dd>11月中予定</dd></dl><p class="price">お支払額 <strong>22,000</strong>円（税込）</p><button id="checkout" type="button" disabled>KOMOJUテスト決済へ進む</button><p id="status" role="status">確認済みのKOMOJUテスト接続情報を設定すると、このボタンを有効化できます。</p><p class="small">この試作ページでは個人情報を収集・保存しません。購入者情報の入力場所は、KOMOJUで採用する接続方式を確認してから確定します。</p></section></main><script src="./checkout-config.js"></script><script src="./checkout-guard.js"></script><script>(()=>{const button=document.getElementById('checkout'),status=document.getElementById('status'),result=window.JummaiCheckoutGuard.validate(window.JUMMAI_CHECKOUT_CONFIG);if(!result.ok){const messages={test_environment_required:'現在は決済を停止しています。KOMOJUの確認済みテスト環境だけを接続できます。',test_evidence_required:'KOMOJUテスト接続の確認記録がないため、決済を停止しています。',offer_mismatch:'商品・金額の設定が一致しないため、決済を停止しています。',untrusted_url:'安全のため、確認できないURLには接続しません。'};status.textContent=messages[result.reason]||'KOMOJUテスト接続の設定が未完了です。';return}button.disabled=false;status.textContent='テスト用KOMOJU決済画面へ移動できます。';button.addEventListener('click',()=>window.location.assign(result.url))})();</script></body></html>
